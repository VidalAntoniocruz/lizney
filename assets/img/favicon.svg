<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lizdany - Mis 15 Años">
  <title>Lizdany - Mis 15 Años</title>

  <!-- 🎨 Definiciones de gradientes -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d156a"/>
      <stop offset="100%" stop-color="#070b3d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5ce6a"/>
      <stop offset="50%" stop-color="#E0CA99"/>
      <stop offset="100%" stop-color="#c9921f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 🔷 Fondo azul marino redondeado -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#bgGrad)"/>

  <!-- ✨ Destellos dorados en las esquinas -->
  <g fill="url(#goldGrad)" opacity="0.85" filter="url(#glow)">
    <circle cx="10" cy="10" r="1.2"/>
    <circle cx="54" cy="12" r="0.9"/>
    <circle cx="12" cy="54" r="0.9"/>
    <circle cx="54" cy="54" r="1.2"/>
    <circle cx="32" cy="6"  r="0.6"/>
    <circle cx="6"  cy="32" r="0.6"/>
    <circle cx="58" cy="32" r="0.6"/>
    <circle cx="32" cy="58" r="0.6"/>
  </g>

  <!-- 🔤 Letra "L" dorada (estilo serif elegante) -->
  <text x="50%" y="54%"
        font-family="'Tiro Bangla', 'Cinzel', 'Georgia', serif"
        font-size="42"
        font-weight="600"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="url(#goldGrad)"
        filter="url(#glow)">L</text>

  <!-- ✦ Pequeño adorno inferior (estrella de 4 puntas) -->
  <path d="M32 52 L33 54 L35 54.5 L33 55 L32 57 L31 55 L29 54.5 L31 54 Z"
        fill="url(#goldGrad)" opacity="0.9"/>
</svg>